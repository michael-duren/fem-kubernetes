</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="119" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="seal-the-eks-copy---stdin-no-plaintext-on-disk">Seal the EKS copy - stdin, no plaintext on disk</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl config current-context   <span class="hljs-comment"># must be EKS</span>
&lt;acct&gt;@fem-workshop...eksctl.io

$ kubectl apply -f .../sealed-secrets/.../controller.yaml

$ kubectl create secret generic db-extra -n app \
    --from-literal=password=demo-not-a-real-password \
    --dry-run=client -o yaml \
  | kubeseal --controller-namespace kube-system --format yaml \
  &gt; manifests/day-two/k8s/overlays/eks/sealed-db-extra.yaml
</code></pre>
<p>Piping into <code>kubeseal</code> beats write-then-<code>rm</code> - nothing to forget on disk.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="120" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="application-points-at-the-eks-overlay-syncs-from-git">Application points at the eks overlay, syncs from git</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl apply -n argocd -f - &lt;&lt;<span class="hljs-string">&#x27;EOF&#x27;</span>
kind: Application
spec:
  <span class="hljs-built_in">source</span>: { repoURL: &lt;repo&gt;, targetRevision: main, path: manifests/day-two/k8s/overlays/eks }
  destination:
    server: https://kubernetes.default.svc
  syncPolicy: { automated: { selfHeal: <span class="hljs-literal">true</span> } }
EOF

$ kubectl get application sample-app -n argocd
NAME         SYNC STATUS   HEALTH STATUS
sample-app   Synced        Healthy
</code></pre>
<p><code>path: manifests/day-two/k8s/overlays/eks</code> - point at <code>base</code> and EKS gets the <code>kind</code> values.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="121" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="built-in--platform-observability">Built-in &amp; Platform Observability</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="122" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="get-a-long-way-before-a-metrics-stack-earns-its-weight">Get a long way before a metrics stack earns its weight</h2>
<ul>
<li><code>kubectl top</code> - live CPU/memory per Pod and node, from <code>metrics-server</code></li>
<li>Events - the cluster's running narration of what happened and why</li>
<li><code>kubectl rollout status</code> - observability for deploys, not just debugging</li>
<li>EKS CloudWatch Container Insights - the platform's own metrics sink</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="123" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-built-in-signals-no-install">The built-in signals, no install</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl top pods -n app
NAME                          CPU(cores)   MEMORY(bytes)
sample-app-7d9c4b5f8-2xq4r    4m           38Mi
postgres-1                    12m          120Mi

$ kubectl get events -n app --sort-by=.lastTimestamp | <span class="hljs-built_in">tail</span>
LAST SEEN   TYPE     REASON          OBJECT         MESSAGE
2m          Normal   Scheduled       pod/sample     Assigned...
90s         Normal   SyncSucceeded   app/sample     synced
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="124" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-platform-option-then-stop">The platform option, then stop</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ aws eks create-addon --cluster-name fem-workshop \
    --region us-west-2 \
    --addon-name amazon-cloudwatch-observability
{ <span class="hljs-string">&quot;addon&quot;</span>: { <span class="hljs-string">&quot;status&quot;</span>: <span class="hljs-string">&quot;CREATING&quot;</span> } }
</code></pre>
<p>We stop here on purpose: a Prometheus/Grafana/Loki stack is its own thing to run, scale, secure, and pay for - reach for it when built-in and platform signals stop being enough, not by default.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="125" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="tearing-it-down">Tearing It Down</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="126" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="cleanup-is-operational-discipline-not-tidying">Cleanup is operational discipline, not tidying</h2>
<ul>
<li>Control plane, nodes, EBS volumes, ALB - each bills by the hour</li>
<li><code>eksctl delete cluster</code> removes what <code>eksctl</code> created</li>
<li>Orphans come from what it <em>didn't</em> create - the ALB and the EBS volumes</li>
<li>Order matters: stop GitOps + let the live LBC deprovision the ALB <em>before</em> the delete</li>
<li>Skip the order and Argo CD <code>selfHeal</code> + the controller re-create the ALB - its ENIs/SGs wedge the VPC delete</li>
<li>The rule is two steps: delete in order, then <strong>verify</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="127" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="stop-reconciliation-deprovision-the-alb-then-delete">Stop reconciliation, deprovision the ALB, then delete</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl delete application sample-app -n argocd   <span class="hljs-comment"># stop selfHeal first</span>
$ kubectl delete gateway sample-app -n app          <span class="hljs-comment"># live LBC tears down the ALB</span>
$ kubectl scale deployment aws-load-balancer-controller \
    -n kube-system --replicas=0                      <span class="hljs-comment"># only after the ALB is gone</span>
$ eksctl delete cluster -f eks-cluster.yaml          <span class="hljs-comment"># region comes from the config</span>
... deleting EKS cluster <span class="hljs-string">&quot;fem-workshop&quot;</span>
</code></pre>
<p>Order is the lesson: skip it and <code>selfHeal</code> + the controller re-create the ALB.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="128" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="then-check-for-orphans---by-cluster-tag-not-name">Then check for orphans - by cluster tag, not name</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ aws elbv2 describe-load-balancers --region us-west-2 \
    --query <span class="hljs-string">&quot;LoadBalancers[].LoadBalancerArn&quot;</span> --output json \
  | xargs -I{} aws elbv2 describe-tags --resource-arns {} --region us-west-2 \
    --query <span class="hljs-string">&quot;TagDescriptions[?Tags[?Key==&#x27;elbv2.k8s.aws/cluster&#x27; \
             &amp;&amp; Value==&#x27;fem-workshop&#x27;]].ResourceArn&quot;</span>
[]

$ aws ec2 describe-volumes --region us-west-2 \
    --filters Name=...cluster/fem-workshop,Values=owned \
              Name=status,Values=available
[]
</code></pre>
<p>Tag-match, not <code>k8s-sampleapp</code>: the real name is <code>k8s-app-sampleap-&lt;hash&gt;</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="129" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="a-cluster-you-forget-about-is-a-bill-you-didnt-budget-for">A cluster you forget about is a bill you didn't budget for</h2>
<p>The single most common cloud-workshop regret is the cluster that ran for a week after everyone went home. The verification is how you guarantee it doesn't happen to anyone in the room.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ eksctl get cluster --region us-west-2
No clusters found <span class="hljs-keyword">in</span> us-west-2.
</code></pre>
<p>Down, verified clean, nothing billing - no one leaves Day 2 with a live cluster.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="130" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="end-of-production">End of Production</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="131" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="what-production-added---hardened-then-cloud">What Production added - hardened, then cloud</h2>
<ul>
<li><strong>Autoscaling:</strong> an HPA sizes the app to CPU load, up and back down</li>
<li><strong>Safe rollouts:</strong> readiness-gated, with <code>rollout undo</code> to a known-good</li>
<li><strong>Drain survival:</strong> a PDB plus replicas keeps serving through <code>drain</code></li>
<li><strong>Least privilege:</strong> a scoped ServiceAccount, Role, and RoleBinding</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="132" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="and-made-it-cloud-native-and-git-driven">...and made it cloud-native and git-driven</h2>
<ul>
<li><strong>GitOps:</strong> Argo CD reconciles git and self-heals drift - no hand-applies</li>
<li><strong>Git-safe secrets:</strong> Sealed Secrets, each cluster sealing its own copy</li>
<li><strong>Migrated to EKS over the same base:</strong> EBS storage, an ALB, an <code>eks</code> overlay</li>
<li>One cluster at a time - then torn down clean, nothing left billing</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="133" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-theme-paid-off-end-to-end">The theme paid off end to end</h2>
<ul>
<li>The same PVC bound to local-path on <code>kind</code>, to EBS on EKS</li>
<li>The same <code>Gateway</code>/<code>HTTPRoute</code> ran behind NGINX, then a real ALB</li>
<li>The same Kustomize base ran on both via environment overlays</li>
<li>Route was the contract; the controller behind it was environmental</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="134" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="wrap-up">Wrap-Up</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="135" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-whole-climb-drawn-once-more">The whole climb, drawn once more</h2>
<p><img src="img/diagrams/day-shape.svg" alt="The full two-day day-shape: Foundations and POC into Stable on Day 1, then Production hardening and the EKS capstone on Day 2 - one application rising through every stage" style="height:430px;" /></p>
<p>One app rode from a bare Pod to autoscaled GitOps on a real cloud cluster.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="136" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-diff-between-stages-is-the-workshop">The diff between stages is the workshop</h2>

<li><strong>Kubernetes docs</strong> - the API reference for everything you touched</li>

<li><strong>Stage branches</strong> <code>poc</code> / <code>stable</code> / <code>production</code> - each stage's exact end-state</li>
</ul>
