<p>Same application, climbing one maturity stage at a time.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="kubernetes-mental-model">Kubernetes Mental Model</h1>
<blockquote>
<p>&quot;Learn the loop.&quot;</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-loop-is-the-whole-idea">The &quot;loop&quot; is the whole idea</h2>
<ul>
<li>Desired state: what you declare you want</li>
<li>Actual state: what the cluster reads as real</li>
<li>Reconciliation: it closes the gap, forever</li>
<li>Same loop in every resource we build</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-loop-drawn-plainly">The loop, drawn plainly</h2>
<p><img src="img/diagrams/seg02-loop-defined.svg" alt="The control loop with no analogy: desired state and actual state feed reconciliation, which closes the gap back to desired - forever; a disturbance is driven back by the same self-healing edge" style="height:460px;" /></p>
<p>Desired, actual, reconcile - then again. This shape is every resource.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="cruise-control-is-a-loop">Cruise control is a &quot;loop&quot;</h2>
<p><img src="img/diagrams/seg02-cruise-control-loop.svg" alt="Cruise-control loop: set 65 mph desired, sense actual speed, adjust throttle, and hold 65 against a hill as self-healing" style="height:460px;" /></p>
<p>You set the speed; the car does everything else to keep it.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-same-loop-at-kitchen-scale">The same loop, at kitchen scale</h2>
<p><img src="img/diagrams/seg02-kitchen-control-loop.svg" alt="Kitchen control loop: tickets are desired state, the head chef is the control plane, line-cook stations are worker nodes cooking the containers" style="height:460px;" /></p>
<p>One brain reads the orders; the stations do the cooking.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="your-first-cluster">Your First Cluster</h1>
<p><img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExb3hkM3E1eG9ybDNjN3kxc2hpd3czM3d3aGZudXMyMXBuN25vamc3YSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26ybwvTX4DTkwst6U/giphy.gif" alt="first" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="kubernetes-is-a-standard-not-a-place">Kubernetes is a standard, not a place</h2>
<ul>
<li>One API for every environment - laptop, cloud, on-prem</li>
<li>You declare resources; each environment knows how to run them</li>
<li>A <code>kind</code> cluster today, a cloud cluster tomorrow - same manifests</li>
<li>That standard API is why the same declaration travels</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="same-resources-different-environment">Same resources, different environment</h2>
<p><img src="img/diagrams/seg03-kind-vs-cloud.svg" alt="kind cluster today versus an EKS cloud cluster on Day 2: the same control plane, workers, storage, and Gateway, backed by different controllers per environment" style="height:450px;" /></p>
<p>The definition stays; the location changes.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-cluster-config---one-chef-two-stations">The cluster config - one chef, two stations</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">kind:</span> <span class="hljs-string">Cluster</span>
<span class="hljs-attr">apiVersion:</span> <span class="hljs-string">kind.x-k8s.io/v1alpha4</span>
<span class="hljs-attr">nodes:</span>
  <span class="hljs-bullet">-</span> <span class="hljs-attr">role:</span> <span class="hljs-string">control-plane</span>
    <span class="hljs-attr">extraPortMappings:</span>
      <span class="hljs-bullet">-</span> <span class="hljs-attr">containerPort:</span> <span class="hljs-number">30080</span>
        <span class="hljs-attr">hostPort:</span> <span class="hljs-number">30080</span>
        <span class="hljs-attr">protocol:</span> <span class="hljs-string">TCP</span>
  <span class="hljs-bullet">-</span> <span class="hljs-attr">role:</span> <span class="hljs-string">worker</span>
  <span class="hljs-bullet">-</span> <span class="hljs-attr">role:</span> <span class="hljs-string">worker</span>
</code></pre>
<p>One control-plane, two workers; host port 30080 is mapped for the Gateway later.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="create-the-cluster---one-chef-two-stations">Create the cluster - one chef, two stations</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kind create cluster --config manifests/day-one/kind-cluster.yaml
Creating cluster <span class="hljs-string">&quot;kind&quot;</span> ...
 ✓ Starting control-plane
 ✓ Joining worker nodes
Set kubectl context to <span class="hljs-string">&quot;kind-kind&quot;</span>
</code></pre>
<p><code>kind</code> runs each node as a container on your laptop. Run every command from the repo root.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="proof-the-cluster-is-live">Proof the cluster is live</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl get nodes
NAME                 STATUS   ROLES           AGE
kind-control-plane   Ready    control-plane   60s
kind-worker          Ready    &lt;none&gt;          40s
kind-worker2         Ready    &lt;none&gt;          40s
</code></pre>
<p>Three nodes Ready: one head chef, two cook stations.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="running-an-app">Running an app</h1>
<blockquote>
<p>&quot;Two peas in a pod.&quot;</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="run-the-app-as-a-single-bare-pod">Run the app as a single bare Pod</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl run sample-app \
    --image=docker.io/altf4llc/fem-kubernetes:v1 --port=8080
pod/sample-app created

$ kubectl get pods
NAME         READY   STATUS    RESTARTS   AGE
sample-app   1/1     Running   0          12s
</code></pre>
<p><code>kubectl run</code> is how you explore, not how you operate (unlike Docker, etc).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="delete-it---watch-nothing-bring-it-back">Delete it - watch nothing bring it back</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl delete pod sample-app
pod <span class="hljs-string">&quot;sample-app&quot;</span> deleted

$ kubectl get pods
No resources found <span class="hljs-keyword">in</span> default namespace.
</code></pre>
<p>Nobody was watching it. So when it's gone, it's gone.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="where-did-it-go">...where did it go?</h2>
<p><img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExYWJncXZhdXJkZDcya2V5cmYzMHdxaGF4c3Uyd3VmamZiNjBzYWZ0NCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/lpxqmxzQHL7hUejepu/giphy.gif" alt="meeseeks" /></p>
<p>Bare <code>pods</code> have no controller - so they dissapear.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="deployments--self-healing">Deployments &amp; Self-Healing</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="deployment-watches-the-pod-for-you">Deployment watches the Pod for you</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl create deployment sample-app \
    --image=docker.io/altf4llc/fem-kubernetes:v1
deployment.apps/sample-app created
</code></pre>
<p>Deployment is cruise control: declare N, it holds N.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="delete-a-pod---this-time-it-heals">Delete a Pod - this time it heals</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl delete pod sample-app-7d9c4b5f8-2xq4r
pod <span class="hljs-string">&quot;...-2xq4r&quot;</span> deleted

$ kubectl get pods
NAME                         READY   STATUS    RESTARTS   AGE
sample-app-7d9c4b5f8-9fk2p   1/1     Running   0          4s
</code></pre>
<p>New name, restored count and you did nothing.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="scaling-is-one-flag">Scaling is one flag</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl scale deployment sample-app --replicas=3
deployment.apps/sample-app scaled
</code></pre>
<p>Change the desired count; the controller reconciles to it.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="postgres-joins---ephemeral-on-purpose">Postgres joins - ephemeral on purpose</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl create deployment postgres \
    --image=postgres:16
$ kubectl <span class="hljs-built_in">set</span> <span class="hljs-built_in">env</span> deployment/postgres \
    POSTGRES_PASSWORD=demo-not-a-real-password \
    POSTGRES_DB=appdb
deployment.apps/postgres <span class="hljs-built_in">env</span> updated
</code></pre>
<p>No volume: this data dies on restart. We fix that in Stable.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="services--wiring-the-app-to-postgres">Services &amp; Wiring the App to Postgres</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="service-is-a-stable-address">Service is a stable address</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl expose deployment postgres \
    --port=5432 --name=postgres
service/postgres exposed
</code></pre>
<p>Pod IPs rotate; app finds Postgres by the name <code>postgres</code> instead.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-secret-is-handled-wrong---say-it-out-loud">The secret is handled wrong - say it out loud</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl <span class="hljs-built_in">set</span> <span class="hljs-built_in">env</span> deployment/sample-app \
    DB_HOST=postgres \
    DB_PASSWORD=demo-not-a-real-password
deployment.apps/sample-app <span class="hljs-built_in">env</span> updated
</code></pre>
<p>The app connects fine - the password matches Postgres. It is the <em>method</em> that is wrong: the secret is now plaintext in shell history and on this recording. Exactly how not to.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="reach-the-app-then-prove-the-data-dies">Reach the app, then prove the data dies</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl expose deployment sample-app \
    --<span class="hljs-built_in">type</span>=NodePort --port=8080 --name=sample-app

$ kubectl port-forward service/sample-app 8080:8080 &amp;
$ curl localhost:8080/counter     <span class="hljs-comment"># {&quot;count&quot;: 5}</span>
$ kubectl delete pod -l app=postgres
$ curl localhost:8080/counter     <span class="hljs-comment"># {&quot;count&quot;: 1}</span>
</code></pre>
<p>NodePort is the crude front door; the port-forward is the reliable reach on <code>kind</code>. Counter reset to 1: no volume, no durability.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="proof-of-concept-recap---what-we-built-and-broke">Proof-of-Concept recap - what we built (and broke)</h2>
<ul>
<li>Nothing in git - every resource is a typed command</li>
<li>NodePort access - crude, not a real front door</li>
<li>No health probes, no resource limits</li>
<li>Postgres data dies on restart - ephemeral by design</li>
<li>The password is plaintext - insecure by choice</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="next-the-state-youd-hand-a-teammate">Next: the state you'd hand a teammate</h2>
<p><img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExOG1jaGV5dmQ5dnlvaG9leGN2M3J4YmZ1ZGpmbnFucmFxN2E2cjF5biZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/2HtWpp60NQ9CU/giphy.gif" alt="handshake" /></p>
<p>Stable is the list of fixes.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="imperative-to-declarative">Imperative to Declarative</h1>
<blockquote>
<p>&quot;Imperative is for testing; declarative is for scaling.&quot;</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="what-is-a-manifest">What is a manifest?</h2>
<ul>
<li>Previous commands were one-shot, with no record</li>
<li>A manifest is the desired state, written down</li>
<li>Reviewable, diffable, recreatable, in git</li>
<li>Same desired state - now in a file, not your head</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="every-manifest-has-the-same-four-fields">Every manifest has the same four fields</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">apiVersion:</span> <span class="hljs-string">apps/v1</span>        <span class="hljs-comment"># which API and version</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">Deployment</span>           <span class="hljs-comment"># what kind of resource</span>
<span class="hljs-attr">metadata:</span>                  <span class="hljs-comment"># name, labels, namespace</span>
  <span class="hljs-attr">name:</span> <span class="hljs-string">sample-app</span>
<span class="hljs-attr">spec:</span>                      <span class="hljs-comment"># the desired state of this object</span>
  <span class="hljs-attr">replicas:</span> <span class="hljs-number">1</span>
</code></pre>
<p><code>apiVersion</code> + <code>kind</code> pick the type; <code>metadata</code> names it; <code>spec</code> is what you want.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="this-is-the-deploymentyaml">This is the deployment.yaml</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">apiVersion:</span> <span class="hljs-string">apps/v1</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">Deployment</span>
<span class="hljs-attr">metadata:</span>
  <span class="hljs-attr">name:</span> <span class="hljs-string">sample-app</span>
  <span class="hljs-attr">labels:</span>
    <span class="hljs-attr">app:</span> <span class="hljs-string">sample-app</span>
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">replicas:</span> <span class="hljs-number">1</span>
  <span class="hljs-attr">selector:</span>
    <span class="hljs-attr">matchLabels:</span>
      <span class="hljs-attr">app:</span> <span class="hljs-string">sample-app</span>
  <span class="hljs-attr">template:</span>
    <span class="hljs-attr">metadata:</span>
      <span class="hljs-attr">labels:</span>
        <span class="hljs-attr">app:</span> <span class="hljs-string">sample-app</span>
    <span class="hljs-attr">spec:</span>
      <span class="hljs-attr">containers:</span>
        <span class="hljs-bullet">-</span> <span class="hljs-attr">name:</span> <span class="hljs-string">sample-app</span>
          <span class="hljs-attr">image:</span> <span class="hljs-string">docker.io/altf4llc/fem-kubernetes:v1</span>
          <span class="hljs-attr">ports:</span>
            <span class="hljs-bullet">-</span> <span class="hljs-attr">containerPort:</span> <span class="hljs-number">8080</span>
          <span class="hljs-attr">env:</span>
            <span class="hljs-bullet">-</span> <span class="hljs-attr">name:</span> <span class="hljs-string">DB_HOST</span>
              <span class="hljs-attr">value:</span> <span class="hljs-string">postgres</span>
            <span class="hljs-bullet">-</span> <span class="hljs-attr">name:</span> <span class="hljs-string">DB_PASSWORD</span>
              <span class="hljs-attr">value:</span> <span class="hljs-string">demo-not-a-real-password</span>
</code></pre>
<p>The selector matches the template labels. Plaintext password, still - we fix that in Stable.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="apply-is-declarative-diff-shows-the-changes">Apply is declarative; Diff shows the changes</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl diff -f manifests/day-one/deployment.yaml
$ kubectl apply -f manifests/day-one/deployment.yaml
deployment.apps/sample-app created

$ kubectl apply -f manifests/day-one/deployment.yaml
deployment.apps/sample-app unchanged
</code></pre>
<p>See the change, then apply. Re-applying is a no-op.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="labels-and-selectors-are-the-wiring">Labels and selectors are the wiring</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl get deployments,services
NAME                         READY   UP-TO-DATE   AVAILABLE
deployment.apps/postgres     1/1     1            1
deployment.apps/sample-app   1/1     1            1
</code></pre>
<p>The selector must match the Pod's labels - write both by hand.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-label-and-the-selector-must-match">The label and the selector must match</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">template:</span>
  <span class="hljs-attr">metadata:</span>
    <span class="hljs-attr">labels:</span>
      <span class="hljs-attr">app:</span> <span class="hljs-string">sample-app</span>      <span class="hljs-comment"># the label stamped on the Pod</span>
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">selector:</span>
    <span class="hljs-attr">app:</span> <span class="hljs-string">sample-app</span>        <span class="hljs-comment"># the selector that finds it</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl get pods -l app=sample-app
NAME                         READY   STATUS    RESTARTS   AGE
sample-app-7d9c4b5f8-9fk2p   1/1     Running   0          2m
</code></pre>
<p>Same <code>app: sample-app</code> on both sides - that match is the entire wiring.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="health-checks--resource-management">Health Checks &amp; Resource Management</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="three-probes-three-different-questions">Three probes, three different questions</h2>
<ul>
<li>Readiness: should this Pod get traffic right now?</li>
<li>Liveness: is this Pod wedged and needing a restart?</li>
<li>Startup: has the app finished booting yet?</li>
<li>Requests are for scheduling; limits are for protection</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="break-healthz-on-purpose---watch-it-heal">Break /healthz on purpose - watch it heal</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl <span class="hljs-built_in">exec</span> deploy/sample-app -- sh -c <span class="hljs-string">&#x27;kill -USR1 1&#x27;</span>

$ kubectl get pods --watch
NAME                         READY   STATUS    RESTARTS
sample-app-6f4d8c7b9-tq2lp   1/1     Running   0
sample-app-6f4d8c7b9-tq2lp   0/1     Running   0
sample-app-6f4d8c7b9-tq2lp   1/1     Running   1 (5s ago)
</code></pre>
<p>A running process isn't a working app. The probe knows the difference.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-events-name-why-it-restarted">The events name why it restarted</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl describe pod -l app=sample-app
Events:
  Warning  Unhealthy  kubelet  Liveness probe failed:
           HTTP probe failed with statuscode: 500
  Normal   Killing    kubelet  Container failed liveness
           probe, will be restarted
</code></pre>
<p>The loop learned &quot;the app works&quot; is not &quot;the process exists.&quot;</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="configmaps-secrets--namespaces">ConfigMaps, Secrets &amp; Namespaces</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="config-and-the-manifest">Config and the manifest</h2>
<ul>
<li>ConfigMap: non-secret config - host, port, db name</li>
<li>Secret: sensitive values, handled with more care</li>
<li>Namespace: the app/tooling boundary</li>
<li>The split is about sensitivity, not mechanism</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="a-namespace-for-the-app">A namespace for the app</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl create namespace app
namespace/app created
</code></pre>
<p>Everything from here lives in <code>app</code>, separate from cluster tooling. Add <code>-n app</code> from now on.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="secrets-are-base64-encoded-not-encrypted">Secrets are base64-encoded, NOT encrypted</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl create secret generic db-secret -n app \
    --from-literal=DB_PASSWORD=demo-not-a-real-password

$ kubectl get secret db-secret -n app \
    -o jsonpath=<span class="hljs-string">&#x27;{.data.DB_PASSWORD}&#x27;</span> | <span class="hljs-built_in">base64</span> -d
demo-not-a-real-password
</code></pre>
<p>Came straight back with a standard tool, no key. That's why it stays out of git.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="gateway-api">Gateway API</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-route-is-the-contract-the-controller-is-local">The route is the contract; the controller is local</h2>
<ul>
<li>Gateway + HTTPRoute declare how traffic reaches the app</li>
<li>A controller watches them and makes them real</li>
<li>The route is portable; the controller is per-environment</li>
<li>gatewayClassName is the one line that names it</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="install-the-controller---three-pinned-steps">Install the controller - three pinned steps</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl kustomize <span class="hljs-string">&quot;https://github.com/nginx/nginx-gateway-fabric/config/crd/gateway-api/standard?ref=v2.6.3&quot;</span> | kubectl apply -f -
$ kubectl apply -f https://raw.githubusercontent.com/nginx/nginx-gateway-fabric/v2.6.3/deploy/crds.yaml
$ kubectl apply -f https://raw.githubusercontent.com/nginx/nginx-gateway-fabric/v2.6.3/deploy/nodeport/deploy.yaml
</code></pre>
<p>Gateway API CRDs, then NGF's CRDs, then the controller - it creates its own <code>nginx</code> GatewayClass.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="pin-the-data-plane-to-the-mapped-port">Pin the data plane to the mapped port</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl patch nginxproxy nginx-gateway-proxy-config -n nginx-gateway --<span class="hljs-built_in">type</span>=merge \
    -p <span class="hljs-string">&#x27;{&quot;spec&quot;:{&quot;kubernetes&quot;:{&quot;deployment&quot;:{&quot;pod&quot;:{&quot;nodeSelector&quot;:{&quot;node-role.kubernetes.io/control-plane&quot;:&quot;&quot;},&quot;tolerations&quot;:[{&quot;key&quot;:&quot;node-role.kubernetes.io/control-plane&quot;,&quot;operator&quot;:&quot;Exists&quot;,&quot;effect&quot;:&quot;NoSchedule&quot;}]}},&quot;service&quot;:{&quot;nodePorts&quot;:[{&quot;port&quot;:30080,&quot;listenerPort&quot;:80}]}}}}&#x27;</span>
</code></pre>
<p>Pin the NodePort to <code>30080</code> and pin the data-plane Pod to the control-plane node - the only node kind maps host 30080 on. One host curl then works on both Docker Desktop and OrbStack.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="write-the-listener-and-the-routing">Write the listener and the routing</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">cat</span> manifests/day-one/k8s/base/gateway.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sample-app
  namespace: app
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80

$ kubectl apply -f manifests/day-one/k8s/base/gateway.yaml \
    -f manifests/day-one/k8s/base/httproute.yaml
</code></pre>
<p><code>gatewayClassName: nginx</code> is the only line EKS changes.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-controller-wired-it-up">The controller wired it up</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl get gateway -n app
NAME         CLASS   ADDRESS     PROGRAMMED   AGE
sample-app   nginx   localhost   True         20s

$ curl -H <span class="hljs-string">&quot;Host: sample-app.local&quot;</span> \
    http://localhost:30080/healthz
{<span class="hljs-string">&quot;status&quot;</span>:<span class="hljs-string">&quot;ok&quot;</span>}
</code></pre>
<p>One curl, both runtimes - the data-plane Pod is pinned to the control-plane node, so Docker Desktop and OrbStack both reach localhost:30080.</p>
<p>Same Gateway and HTTPRoute on EKS - a different controller fulfills them.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="operators--crds">Operators &amp; CRDs</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="a-crd-is-a-new-kind-an-operator-is-its-loop">A CRD is a new kind; an operator is its loop</h2>
<ul>
<li>A CRD teaches the API server a new kind</li>
<li><code>kubectl get clusters</code> becomes as real as <code>get pods</code></li>
<li>An operator is the control loop that reconciles them</li>
<li>We consume an operator - we do not write one</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="install-the-operator---no-database-yet">Install the operator - no database yet</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl apply --server-side -f \
    https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.29.1/cnpg-1.29.1.yaml

$ kubectl get crds | grep cnpg
clusters.postgresql.cnpg.io
backups.postgresql.cnpg.io
scheduledbackups.postgresql.cnpg.io

$ kubectl get clusters -A
No resources found
</code></pre>
<p>The kind exists; nothing has declared one.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="durable-postgres-with-cloudnativepg">Durable Postgres with CloudNativePG</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="you-declare-a-cluster-the-operator-does-the-rest">You declare a Cluster; the operator does the rest</h2>
<ul>
<li>CNPG manages Pods and PVCs like a StatefulSet would</li>
<li>Plus failover, backups, and safe rolling upgrades</li>
<li>It generates and owns the credentials - no human did</li>
<li>The app talks to the <code>-rw</code> Service</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="a-few-lines-of-yaml-become-durable-postgres">A few lines of YAML become durable Postgres</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">cat</span> manifests/day-one/k8s/base/postgres-cluster.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: app
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: appdb
      owner: appuser

$ kubectl get cluster postgres -n app
NAME       READY   STATUS                     PRIMARY
postgres   1       Cluster <span class="hljs-keyword">in</span> healthy state   postgres-1
</code></pre>
<p>StatefulSet's worth of configs - managed for you.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="restart-the-pod---the-data-survives">Restart the Pod - the data survives</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ curl -H <span class="hljs-string">&quot;Host: sample-app.local&quot;</span> http://localhost:30080/counter   <span class="hljs-comment"># {&quot;count&quot;: 1}</span>
$ kubectl delete pod postgres-1 -n app
pod <span class="hljs-string">&quot;postgres-1&quot;</span> deleted

$ curl -H <span class="hljs-string">&quot;Host: sample-app.local&quot;</span> http://localhost:30080/counter   <span class="hljs-comment"># {&quot;count&quot;: 2}</span>
</code></pre>
<p>The count continued. POC reset to 1 - the PVC outlives the Pod.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="and-this-time-it-survives">...and this time it survives</h2>
<p><img src="https://media.giphy.com/media/3o6ZtlYXUF93rBxr1K/giphy.gif" alt="The data outlived the Pod restart - the exact POC failure, now fixed by a PVC" style="width:480px;" /></p>
<p>No human authored the database password.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="organizing-manifests-with-kustomize">Organizing Manifests with Kustomize</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="a-base-collects-manifests-into-one-unit">A base collects manifests into one unit</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">cat</span> manifests/day-one/k8s/base/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app
resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - gateway.yaml
  - httproute.yaml
  - postgres-cluster.yaml

$ kubectl apply -k manifests/day-one/k8s/base
</code></pre>
<p><code>kubectl apply -k</code> is built into kubectl. Base only - overlays are Production.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="stable-recap---every-proof-of-concept-sin-fixed">Stable recap - every proof-of-concept sin, fixed</h2>
<ul>
<li>Declarative and in git, organized as a Kustomize base</li>
<li>Probed: readiness, liveness, startup</li>
<li>Resource-bounded: requests and limits</li>
<li>Real front door: a Gateway, not a NodePort</li>
<li>Durably Postgres-backed: data survives a restart</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="stable-recap---whats-still-wrong">Stable recap - what's still wrong</h2>
<ul>
<li>Runs on exactly one local cluster</li>
<li>Scaling is manual</li>
<li>No safe-rollout or rollback discipline</li>
<li>Over-permissioned default ServiceAccount</li>
<li>No story for a node going away</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="half-of-the-climb">Half of the climb</h2>
<p><img src="img/diagrams/day-shape.svg" alt="Two-day day-shape with Day 1 highlighted: Foundations, POC, then Stable on kind - Day 2's Production and EKS capstone still ahead" style="height:430px;" /></p>
<p>Imperative POC to declarative Stable - all on one <code>kind</code> cluster.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="you-made-it-so-far">...you made it so far</h2>
<p><img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExMTduYnFyd2hiamh6eDllNXZodDVibzR3NnFjcmhjN3c2aDNrYm1mYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/sBLcw5Ic4QUTK/giphy.gif" alt="recap" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-shape-before-we-move-on">The shape, before we move on</h2>
<p><img src="img/diagrams/day-shape.svg" alt="Two-day day-shape: Foundations, POC, and Stable behind us on Day 1; Production hardening and the EKS capstone ahead on Day 2" style="height:430px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-right-hand-column">The right-hand column</h2>
<ul>
<li>Your <code>kind</code> cluster is the left-hand, edge end of that picture</li>
<li>Right-hand column is the journey to the managed cloud build</li>
<li>Production hardens it; the EKS cluster runs it for real</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="where-we-left-it">Where we left it</h2>
<ul>
<li>Declarative, in git, organized as a Kustomize base</li>
<li>Probed, resource-bounded, gateway-fronted</li>
<li>Durable CNPG Postgres; no human-authored password</li>
<li>All still on one local <code>kind</code> cluster</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="in-the-end-the-same-app">In the end, the same app</h2>
<ul>
<li>Autoscales under load</li>
<li>Rolls out safely, with a rollback story</li>
<li>Is RBAC-scoped, keeps its secrets git-safe</li>
<li>Is driven by Argo CD from git - and runs on EKS</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="autoscaling-with-hpa">Autoscaling with HPA</h1>
<blockquote>
<p>&quot;The app sizes itself to load - no human typing <code>scale</code>.&quot;</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-control-loop-applied-to-capacity">The control loop, applied to capacity</h2>
<ul>
<li>You declare a CPU target; the HPA holds the replica count to it</li>
<li><code>kind</code> ships no metrics, so <code>metrics-server</code> goes in first</li>
<li>Let it warm up while you walk the spec - <code>&lt;unknown&gt;</code> early is just &quot;not scraped yet&quot;</li>
<li>Percentage is against the Pod's CPU <strong>request</strong> (set back in Stable)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="metrics-server-first-then-the-hpa">metrics-server first, then the HPA</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl apply -f .../metrics-server/components.yaml
$ kubectl patch deployment metrics-server -n kube-system \
    --<span class="hljs-built_in">type</span>=json -p=<span class="hljs-string">&#x27;[{&quot;op&quot;:&quot;add&quot;,
    &quot;path&quot;:&quot;.../args/-&quot;,&quot;value&quot;:&quot;--kubelet-insecure-tls&quot;}]&#x27;</span>
deployment.apps/metrics-server patched

$ kubectl autoscale deployment sample-app \
    --cpu-percent=50 --min=1 --max=5
horizontalpodautoscaler.autoscaling/sample-app autoscaled
</code></pre>
<p><code>--kubelet-insecure-tls</code> is a <code>kind</code>-only concession - name it out loud.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="drive-load---watch-replicas-climb-then-settle">Drive load - watch replicas climb, then settle</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl run load --<span class="hljs-built_in">rm</span> -it --image=busybox -- sh -c \
    <span class="hljs-string">&quot;while true; do wget -qO- sample-app:8080/&lt;data&gt;; done&quot;</span>

$ kubectl get hpa --watch
NAME         REFERENCE               TARGETS        REPLICAS
sample-app   Deployment/sample-app   cpu: 2%/50%    1
sample-app   Deployment/sample-app   cpu: 180%/50%  1
sample-app   Deployment/sample-app   cpu: 180%/50%  4
sample-app   Deployment/sample-app   cpu: 61%/50%   4
</code></pre>
<p>It grew under load and shrinks back - scale-down lags on purpose.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="safe-rollouts--rollbacks">Safe Rollouts &amp; Rollbacks</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="a-rolling-update-gated-by-the-probe">A rolling update, gated by the probe</h2>
<ul>
<li><code>maxSurge</code> / <code>maxUnavailable</code>: replace Pods a few at a time, capacity stays up</li>
<li>The readiness probe is the interlock - a new Pod counts only once it's ready</li>
<li>A new version that never gets ready can't proceed: the rollout <strong>stalls</strong></li>
<li>A stalled rollout is the guardrail working, not a failure</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="break-it-on-purpose---the-rollout-stalls">Break it on purpose - the rollout stalls</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl <span class="hljs-built_in">set</span> image deployment/sample-app \
    sample-app=&lt;registry&gt;/&lt;image&gt;:does-not-exist
$ kubectl rollout status deployment/sample-app --<span class="hljs-built_in">timeout</span>=60s
Waiting <span class="hljs-keyword">for</span> deployment rollout to finish: 1 old replicas...
error: timed out waiting <span class="hljs-keyword">for</span> the condition

$ kubectl get pods
NAME                       READY  STATUS         RESTARTS
sample-app-7d9c4b5f8-2xq4r 1/1    Running        0
sample-app-6c4f9b2a1-pk8wd 0/1    ErrImagePull   0
</code></pre>
<p><code>ErrImagePull</code> first, then settles into <code>ImagePullBackOff</code> - new Pod wedged, old Pod still serving, the app is <strong>not</strong> down.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="it-caught-it">...it caught it</h2>
<p>The bad image is held back; the old version keeps answering. One command to recover:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl rollout undo deployment/sample-app
deployment.apps/sample-app rolled back
deployment <span class="hljs-string">&quot;sample-app&quot;</span> successfully rolled out
</code></pre>
<p><code>undo</code> reverts to the last known-good ReplicaSet - already on disk.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="poddisruptionbudgets--node-drains">PodDisruptionBudgets &amp; Node Drains</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="voluntary-disruption-is-the-kind-you-can-plan-for">Voluntary disruption is the kind you can plan for</h2>
<ul>
<li>Involuntary (a node crashes) - you only heal afterward</li>
<li>Voluntary (an admin drains for maintenance) - a PDB can hold it back</li>
<li>A PDB says &quot;never fewer than N app Pods available&quot;</li>
<li><code>drain</code> cordons the node and evicts politely, honoring the PDB</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="a-floor-of-replicas-then-a-budget">A floor of replicas, then a budget</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl scale deployment sample-app --replicas=3
$ kubectl create poddisruptionbudget sample-app \
    --selector=app=sample-app --min-available=2
poddisruptionbudget.policy/sample-app created

$ kubectl get pdb
NAME         MIN AVAILABLE   ALLOWED DISRUPTIONS   AGE
sample-app   2               1                     10s
</code></pre>
<p><code>ALLOWED DISRUPTIONS</code> is how many can go right now without breaching.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="drain-the-node---the-app-keeps-answering">Drain the node - the app keeps answering</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl get pod postgres-1 -n app -o wide
NAME         READY   STATUS    NODE
postgres-1   1/1     Running   kind-worker

$ kubectl drain kind-worker2 \
    --ignore-daemonsets --delete-emptydir-data
node/kind-worker2 cordoned
pod/sample-app-7d9c4b5f8-2xq4r evicted
node/kind-worker2 drained

$ curl -H <span class="hljs-string">&quot;Host: sample-app.local&quot;</span> localhost/healthz
{<span class="hljs-string">&quot;status&quot;</span>:<span class="hljs-string">&quot;ok&quot;</span>}
</code></pre>
<p>CNPG's single-instance <code>postgres-primary</code> PDB allows 0 disruptions - drain the <strong>other</strong> worker. No outage; at worst a sub-second blip if the <code>nginx-gateway</code> controller Pod rode the drained node, recovering instantly.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="rbac--least-privilege">RBAC &amp; Least Privilege</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="give-the-workload-its-job---and-nothing-more">Give the workload its job - and nothing more</h2>
<ul>
<li>It's been running under the namespace's broad <code>default</code> ServiceAccount</li>
<li>Role = allowed verbs on resources; RoleBinding ties a Role to a subject</li>
<li>This app only reads its own ConfigMap - that's the entire grant</li>
<li>It never calls the API, so don't even mount a token</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="a-dedicated-identity-scoped-tight">A dedicated identity, scoped tight</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl create serviceaccount sample-app
$ kubectl patch serviceaccount sample-app \
    -p <span class="hljs-string">&#x27;{&quot;automountServiceAccountToken&quot;: false}&#x27;</span>

$ kubectl create role sample-app \
    --verb=get,list --resource=configmaps
$ kubectl create rolebinding sample-app \
    --role=sample-app --serviceaccount=app:sample-app
$ kubectl <span class="hljs-built_in">set</span> serviceaccount deployment/sample-app sample-app
</code></pre>
<p>ServiceAccount, Role, RoleBinding, then assign it to the Deployment.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="prove-the-blast-radius">Prove the blast radius</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl auth can-i get configmaps \
    --as=system:serviceaccount:app:sample-app
<span class="hljs-built_in">yes</span>

$ kubectl auth can-i get secrets \
    --as=system:serviceaccount:app:sample-app
no
</code></pre>
<p>Compromise this Pod and the cluster blast radius is exactly that Role.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="gitops-with-argo-cd">GitOps with Argo CD</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="92" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-cruise-control-loop-with-git-as-the-dial">The cruise-control loop, with git as the dial</h2>
<ul>
<li>Git is the desired state; Argo CD drives the cluster to match - forever</li>
<li>You stop running <code>apply</code> - you commit, the reconciler applies</li>
<li>One Argo CD per cluster, managing the cluster it lives in</li>
<li>Budget reality: install + <strong>one</strong> synced app; drift demo if time allows</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="93" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="install-argo-cd-point-an-application-at-the-base">Install Argo CD, point an Application at the base</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl create namespace argocd
$ kubectl apply --server-side -n argocd \
    -f .../argo-cd/v3.4.3/manifests/install.yaml

$ kubectl apply -n argocd -f - &lt;&lt;<span class="hljs-string">&#x27;EOF&#x27;</span>
kind: Application
spec:
  <span class="hljs-built_in">source</span>:
    repoURL: &lt;repo&gt;
    targetRevision: main
    path: manifests/day-one/k8s/base
  destination:
    server: https://kubernetes.default.svc
  syncPolicy: { automated: { selfHeal: <span class="hljs-literal">true</span> } }
EOF
</code></pre>
<p><code>--server-side</code>: the <code>applicationsets</code> CRD exceeds kubectl's 256KB client-side limit. <code>destination.server</code> is the in-cluster API - no external registration.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="94" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="drift-the-loop-catches-a-hand-edit">Drift: the loop catches a hand-edit</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl scale deployment sample-app --replicas=4
$ kubectl get application sample-app -n argocd
NAME         SYNC STATUS   HEALTH STATUS
sample-app   OutOfSync     Healthy

$ kubectl get deployment sample-app
NAME         READY   UP-TO-DATE   AVAILABLE
sample-app   2/2     2            2
</code></pre>
<p><code>selfHeal</code> reverts the manual change - git won, no one applied it. The <code>OutOfSync</code> window is sub-second here, so catch it fast or pre-stage a screenshot.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="95" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="gitops-secrets-with-sealed-secrets">GitOps Secrets with Sealed Secrets</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="96" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="first-two-minutes-start-eks-in-the-background">First two minutes: start EKS in the background</h2>
<ul>
<li><code>eksctl create cluster</code> now - a control plane takes 15-20 min</li>
<li>It provisions unattended while this whole segment stays on <code>kind</code></li>
<li>base64 is not encryption - that's why the Secret was kept out of git</li>
<li>Sealed Secrets is the operator pattern again, doing one thing: decrypt</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="97" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="kick-it-off-then-switch-back-to-kind">Kick it off, then switch back to kind</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ eksctl create cluster -f eks-cluster.yaml
... building cluster stack <span class="hljs-string">&quot;eksctl-fem-workshop-cluster&quot;</span>
... deploying stack ...  <span class="hljs-comment"># ~15-20 min, unattended</span>

$ kubectl config use-context kind-kind
Switched to context <span class="hljs-string">&quot;kind-kind&quot;</span>.

$ kubectl apply -f .../sealed-secrets/.../controller.yaml
deployment.apps/sealed-secrets-controller created
</code></pre>
<p>Leave EKS building; do not wait on it - teach while it provisions.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="98" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="seal-the-secret---plaintext-stays-local">Seal the Secret - plaintext stays local</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl create secret generic db-extra -n app \
    --from-literal=password=demo-not-a-real-password \
    --dry-run=client -o yaml &gt; db-extra-secret.yaml

$ kubeseal --controller-namespace kube-system \
    --format yaml &lt; db-extra-secret.yaml \
    &gt; sealed-db-extra.yaml

$ <span class="hljs-built_in">rm</span> db-extra-secret.yaml   <span class="hljs-comment"># never commit the plaintext</span>
</code></pre>
<p><code>demo-not-a-real-password</code> is a throwaway - the app never reads it.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="99" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-ciphertext-is-git-safe">The ciphertext is git-safe</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ grep -A1 encryptedData sealed-db-extra.yaml
  encryptedData:
    password: AgBvA3f9...ciphertext-not-the-password...==

$ kubectl apply -f sealed-db-extra.yaml
sealedsecret.bitnami.com/db-extra created

$ kubectl get sealedsecret,secret db-extra -n app
sealedsecret.bitnami.com/db-extra   15s
secret/db-extra      Opaque   1      14s
</code></pre>
<p>Commit the <code>SealedSecret</code>; the controller decrypts it in-cluster.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="100" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="going-to-the-cloud-your-eks-cluster">Going to the Cloud: Your EKS Cluster</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="101" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-cluster-from-is-up---no-wait">The cluster from is up - no wait</h2>
<ul>
<li>EKS runs the control plane: API server, etcd, scheduler - all managed</li>
<li>You own the worker nodes and the workloads; never SSH the control plane</li>
<li>One cluster at a time - we <em>migrate</em> to EKS, we don't federate</li>
<li>It bills by the hour - which is exactly why we tear it down</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="102" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="switch-context-confirm-the-nodes-are-real-ec2">Switch context, confirm the nodes are real EC2</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl config use-context &lt;acct&gt;@fem-workshop...eksctl.io
Switched to context <span class="hljs-string">&quot;...eksctl.io&quot;</span>.

$ kubectl get nodes
NAME                          STATUS   ROLES    AGE
ip-192-168-12-34...internal   Ready    &lt;none&gt;   3m
ip-192-168-56-78...internal   Ready    &lt;none&gt;   3m
</code></pre>
<p>The context switch is what moves every command to the cloud.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="103" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="up-but-bare---name-the-gaps">Up, but bare - name the gaps</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl get storageclass
NAME   PROVISIONER             RECLAIMPOLICY   VOLUMEBINDINGMODE
gp2    kubernetes.io/aws-ebs   Delete          WaitForFirstConsumer
</code></pre>
<ul>
<li>No local-path provisioner - storage is the next gap (25)</li>
<li>No Gateway controller - networking after that (26)</li>
<li>No Sealed Secrets controller yet - its own key comes in 28</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="104" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="cluster-storage--the-ebs-csi-driver">Cluster Storage &amp; the EBS CSI Driver</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="105" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-pvc-is-the-contract-the-provisioner-is-environmental">The PVC is the contract; the provisioner is environmental</h2>
<ul>
<li>A PVC is a stable request - &quot;1Gi of durable storage&quot;</li>
<li><code>kind</code> answered it with local-path; EKS answers with EBS CSI</li>
<li>gp3 over the default gp2 - better baseline, decoupled IOPS</li>
<li><code>WaitForFirstConsumer</code>: bind the zonal volume where the Pod lands</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="106" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="driver-as-a-managed-add-on-then-a-gp3-class">Driver as a managed add-on, then a gp3 class</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ eksctl create addon --name aws-ebs-csi-driver \
    --cluster fem-workshop --region us-west-2 --force
... addon <span class="hljs-string">&quot;aws-ebs-csi-driver&quot;</span> active

$ kubectl apply -f - &lt;&lt;<span class="hljs-string">&#x27;EOF&#x27;</span>
kind: StorageClass
metadata:
  name: gp3
  annotations: { ...is-default-class: <span class="hljs-string">&quot;true&quot;</span> }
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
parameters: { <span class="hljs-built_in">type</span>: gp3 }
EOF
storageclass.storage.k8s.io/gp3 created
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="107" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-unchanged-cnpg-manifest-binds-to-real-ebs">The unchanged CNPG manifest binds to real EBS</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl get pvc -n app
NAME         STATUS   VOLUME      CAPACITY   STORAGECLASS
postgres-1   Bound    pvc-a1b2c3  1Gi        gp3

$ aws ec2 describe-volumes --region us-west-2 \
    --filters Name=tag:...pvc/name,Values=postgres-1 \
    --query <span class="hljs-string">&#x27;Volumes[].{ID:VolumeId,Type:VolumeType}&#x27;</span>
[ { <span class="hljs-string">&quot;ID&quot;</span>: <span class="hljs-string">&quot;vol-0abc123def456&quot;</span>, <span class="hljs-string">&quot;Type&quot;</span>: <span class="hljs-string">&quot;gp3&quot;</span> } ]
</code></pre>
<p>Same Postgres manifest - manifest portable, storage class environmental.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="108" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="cloud-networking--the-aws-load-balancer-controller">Cloud Networking &amp; the AWS Load Balancer Controller</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="109" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-callback-route-is-a-contract-controller-is-environmental">The callback: route is a contract, controller is environmental</h2>
<ul>
<li>Same lesson as storage - now for the front door</li>
<li>On <code>kind</code>, NGINX Gateway Fabric fulfilled the <code>Gateway</code>/<code>HTTPRoute</code></li>
<li>On EKS, the AWS LB Controller turns the same YAML into a real ALB</li>
<li>A <code>GatewayClass</code> names which controller picks up the <code>Gateway</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="110" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="install-iam-then-cert-manager--crds--controller">Install: IAM, then cert-manager + CRDs + controller</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ aws iam create-policy --policy-name AWSLoadBalancerControllerIAMPolicy \
    --policy-document file://iam_policy.json   <span class="hljs-comment"># account-level, create once</span>
$ eksctl create iamserviceaccount --cluster fem-workshop \
    --namespace kube-system --name aws-load-balancer-controller \
    --attach-policy-arn arn:aws:iam::&lt;acct&gt;:policy/AWSLoadBalancerControllerIAMPolicy \
    --approve
... created serviceaccount

$ kubectl apply --validate=<span class="hljs-literal">false</span> -f .../cert-manager.yaml
$ kubectl apply --server-side -f \
    .../gateway-api/releases/download/v1.5.0/standard-install.yaml  <span class="hljs-comment"># gateway.networking.k8s.io</span>
$ kubectl apply -f .../gateway-crds.yaml                            <span class="hljs-comment"># gateway.k8s.aws (LBC)</span>
$ kubectl apply -f .../v3_X_Y_full.yaml   <span class="hljs-comment"># pin v3.0.0+</span>
deployment.apps/aws-load-balancer-controller created
</code></pre>
<p><code>v3_X_Y_full.yaml</code> is a placeholder - apply your pinned version.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="111" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="alb-config-is-type-safe-crds-not-annotations">ALB config is type-safe CRDs, not annotations</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl apply -f - &lt;&lt;<span class="hljs-string">&#x27;EOF&#x27;</span>
kind: LoadBalancerConfiguration   <span class="hljs-comment"># the scheme</span>
spec: { scheme: internet-facing }
---
kind: GatewayClass
spec:
  controllerName: gateway.k8s.aws/alb
  parametersRef: { kind: LoadBalancerConfiguration, ... }
EOF
gatewayclass.gateway.networking.k8s.io/alb created
</code></pre>
<p>The old <code>Ingress</code> smeared <code>alb.ingress.*</code> annotations - now real objects.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="112" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="same-gateway--httproute-%E2%86%92-a-real-alb">Same Gateway + HTTPRoute → a real ALB</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl apply -f - &lt;&lt;<span class="hljs-string">&#x27;EOF&#x27;</span>
kind: Gateway
spec: { gatewayClassName: alb, listeners: [...] }
EOF
gateway.../sample-app created

$ kubectl get gateway sample-app -n app
NAME         CLASS   ADDRESS                       PROGRAMMED
sample-app   alb     k8s-app-sampleap-&lt;<span class="hljs-built_in">hash</span>&gt;...elb...    True

$ curl http://k8s-app-sampleap-&lt;<span class="hljs-built_in">hash</span>&gt;...elb.amazonaws.com/healthz
{<span class="hljs-string">&quot;status&quot;</span>:<span class="hljs-string">&quot;ok&quot;</span>}
</code></pre>
<p>Only <code>gatewayClassName</code> changed - contract unchanged, controller environmental.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="113" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="environment-overlays-with-kustomize">Environment Overlays with Kustomize</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="114" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="two-overlays-over-the-untouched-base">Two overlays over the untouched base</h2>
<ul>
<li>The base stays exactly as it is - overlays patch, never rewrite</li>
<li>An overlay = a few patches + a reference to the base</li>
<li><code>kind</code>: local-path, <code>nginx</code> class, low replicas</li>
<li><code>eks</code>: gp3, <code>alb</code> class, higher replicas - express difference, not two live clusters</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="115" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="the-eks-overlay-names-the-base-and-its-patches">The eks overlay names the base and its patches</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">cat</span> &gt; manifests/day-two/k8s/overlays/eks/kustomization.yaml &lt;&lt;<span class="hljs-string">&#x27;EOF&#x27;</span>
resources:
  - ../../../../day-one/k8s/base
patches:
  - path: gateway-class-alb.yaml
    target: { kind: Gateway, name: sample-app }
  - path: storageclass-gp3.yaml
    target: { kind: Cluster, name: postgres }
  - path: replicas-4.yaml
    target: { kind: Deployment, name: sample-app }
EOF
</code></pre>
<p><code>manifests/day-two/k8s/overlays/kind/</code> does the same with the <code>nginx</code> class and replicas-2.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="116" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="diff-proves-the-base-is-untouched">Diff proves the base is untouched</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ diff &lt;(kubectl kustomize manifests/day-one/k8s/base) \
       &lt;(kubectl kustomize manifests/day-two/k8s/overlays/eks) | <span class="hljs-built_in">head</span>
&lt;     gatewayClassName: nginx
&gt;     gatewayClassName: alb
&lt;   replicas: 2
&gt;   replicas: 4
&gt;   storageClass: gp3
</code></pre>
<p>A handful of lines - that's the entire <code>kind</code>-to-cloud delta.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="117" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h1 id="gitops-on-eks">GitOps on EKS</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="118" data-class="invert lead" data-theme="workshop" lang="en-US" class="invert lead" style="--class:invert lead;--theme:workshop;">
<h2 id="argo-cd-lives-in-the-cluster-it-manages---so-eks-gets-its-own">Argo CD lives in the cluster it manages - so EKS gets its own</h2>
<ul>
<li>Same install as, on EKS, reconciling the <code>eks</code> overlay</li>
<li>No external-cluster registration, no fan-out - one Argo CD per cluster</li>
<li>The <code>kind</code>-sealed Secret can't decrypt here: keys are per-cluster</li>
<li>So EKS installs its own controller and seals its own copy</li>
</ul>
</section>
